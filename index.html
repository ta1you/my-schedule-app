<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Simple personal schedule manager">
    <meta name="theme-color" content="#4f46e5">
    <title>My Schedule</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1>My Schedule</h1>
            <div class="header-controls">
                <button type="button" class="btn btn-secondary" id="btn-today" aria-label="今日に戻る"
                    style="white-space: nowrap; font-size: 0.8rem; padding: 4px 10px;">
                    今日
                </button>
            </div>
        </header>
        <main id="main-content">
            <div id="list-view-container" style="width: 100%;">
                <div class="category-tabs">
                    <button type="button" class="tab-btn active" data-category="all">全て</button>
                    <button type="button" class="tab-btn" data-category="バイト">バイト</button>
                    <button type="button" class="tab-btn" data-category="学校">学校</button>
                    <button type="button" class="tab-btn" data-category="その他">その他</button>
                </div>
                <div id="schedule-list" class="schedule-list"></div>
            </div>
            <div id="calendar-view" class="calendar-view" hidden></div>
            <div id="finance-view" class="finance-view" hidden style="padding:1rem;">
                <h3 style="margin-top:0; font-size:1rem;">今月の収支</h3>
                <form id="finance-form"
                    style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem; flex-wrap:wrap;">
                    <select id="finance-type"
                        style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px;">
                        <option value="slot">スロット</option>
                        <option value="pachinko">パチンコ</option>
                        <option value="other">その他</option>
                    </select>
                    <input type="date" id="finance-date" required
                        style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px;">
                    <input type="number" id="finance-investment" placeholder="投資 (円)" required
                        style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px; width:120px;">
                    <input type="number" id="finance-payout" placeholder="回収 (円)" required
                        style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px; width:120px;">
                    <input type="text" id="finance-note" placeholder="メモ"
                        style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px; flex:1; min-width:160px;">
                    <button type="submit" class="btn btn-primary" style="padding:0.35rem 0.6rem;">追加</button>
                </form>
                <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;">
                    <label for="finance-mode" style="color:var(--text-secondary); font-size:0.85rem;">表示:</label>
                    <select id="finance-mode"
                        style="padding:0.3rem; border:1px solid var(--border-color); border-radius:6px;">
                        <option value="cumulative">累積</option>
                        <option value="daily">日別</option>
                        <option value="stacked">積み上げ折れ線</option>
                        <option value="bars">棒グラフ</option>
                    </select>
                </div>
                <div style="position:relative;">
                    <canvas id="finance-chart" width="800" height="300" style="max-width:100%; height:300px;"></canvas>
                    <div id="finance-tooltip" class="finance-tooltip" hidden></div>
                </div>
                <div id="finance-legend" style="margin-top:0.5rem; color:var(--text-secondary); font-size:0.9rem;">
                </div>
                <div id="finance-entries" class="finance-entries" style="margin-top:0.75rem;"></div>


            </div>
        </main>
        <div id="settings-view" class="settings-view" hidden style="padding: 1rem;">
            <h3 style="margin-top: 0; font-size: 1.1rem; margin-bottom: 1rem;">設定</h3>
            <div class="settings-section"
                style="background: var(--bg-surface); padding: 1rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <h4 style="font-size: 1rem; margin-bottom: 0.5rem;">タブの表示設定</h4>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">
                    下のメニューに表示するタブを選択できます。
                </p>
                <div class="setting-item"
                    style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border-light);">
                    <label for="toggle-list" style="font-weight: 500;">リスト</label>
                    <input type="checkbox" id="toggle-list" checked>
                </div>
                <div class="setting-item"
                    style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border-light);">
                    <label for="toggle-calendar" style="font-weight: 500;">カレンダー</label>
                    <input type="checkbox" id="toggle-calendar" checked>
                </div>
                <div class="setting-item"
                    style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0;">
                    <label for="toggle-finance" style="font-weight: 500;">収支</label>
                    <input type="checkbox" id="toggle-finance" checked>
                </div>
            </div>

            <div style="margin-top: 2rem; text-align: center; color: var(--text-tertiary); font-size: 0.8rem;">
                My Schedule App v1.0.1
            </div>
        </div>
        <button id="fab-add" class="fab" aria-label="予定を追加">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </div>
    <dialog id="schedule-modal" class="modal">
        <form id="schedule-form" method="dialog">
            <header class="modal-header">
                <div class="modal-header-content">
                    <div style="display: flex; align-items: center; gap: var(--spacing-sm); flex: 1;">
                        <h2 id="modal-title" style="margin: 0; font-size: 1.1rem;">予定を追加</h2>
                    </div>
                    <button type="button" class="close-btn" id="modal-close">✕</button>
                </div>
            </header>
            <div class="modal-body">
                <input type="hidden" name="id">
                <div class="form-group">
                    <label for="title">タイトル</label>
                    <input type="text" id="title" name="title" autocomplete="off" list="title-suggestions"
                        placeholder="タイトルを入力または選択" style="cursor: pointer;">
                    <datalist id="title-suggestions">
                        <option value="バイト"></option>
                        <option value="学校"></option>
                        <option value="その他"></option>
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="date">日付</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="start-time">開始</label>
                        <input type="time" id="start-time" name="start-time">
                    </div>
                    <div class="form-group">
                        <label for="end-time">終了</label>
                        <input type="time" id="end-time" name="end-time">
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">メモ</label>
                    <textarea id="description" name="description" rows="3"></textarea>
                </div>
            </div>
            <footer class="modal-footer">
                <button type="button" class="btn btn-danger" id="btn-delete" hidden>削除</button>
                <div class="spacer"></div>
                <button type="button" class="btn btn-secondary" id="btn-cancel">キャンセル</button>
                <button type="submit" class="btn btn-primary" id="btn-save">保存</button>
            </footer>
        </form>
    </dialog>

    <nav class="bottom-nav">
        <button type="button" class="nav-item active" id="btn-view-list">
            <span class="nav-icon">📝</span>
            <span class="nav-label">リスト</span>
        </button>
        <button type="button" class="nav-item" id="btn-view-calendar">
            <span class="nav-icon">📅</span>
            <span class="nav-label">カレンダー</span>
        </button>
        <button type="button" class="nav-item" id="btn-finance">
            <span class="nav-icon">💰</span>
            <span class="nav-label">収支</span>
        </button>
        <button type="button" class="nav-item" id="btn-settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">設定</span>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
