<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Simple personal schedule manager">
    <meta name="theme-color" content="#4f46e5">
    <title>My Schedule</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1>My Schedule</h1>
            <div class="header-controls">
                <div class="view-toggle">
                    <button type="button" class="btn btn-secondary active" id="btn-view-list" aria-label="リスト表示">
                        リスト
                    </button>
                    <button type="button" class="btn btn-secondary" id="btn-view-calendar" aria-label="カレンダー表示">
                        カレンダー
                    </button>
                    <button type="button" class="btn btn-secondary" id="btn-finance" aria-label="収支表示" style="margin-left:0.5rem;">
                        収支
                    </button>
                </div>
                <button type="button" class="btn btn-secondary" id="btn-today" aria-label="今日に戻る"
                    style="font-size: 0.9rem; padding: 0.25rem 0.5rem; margin-left: 0.5rem;">
                    今日
                </button>
            </div>
        </header>
        <main id="main-content">
            <div id="list-view-container" style="width: 100%;">
                <div class="category-tabs">
                    <button type="button" class="tab-btn active" data-category="all">全て</button>
                    <button type="button" class="tab-btn" data-category="バイト">バイト</button>
                    <button type="button" class="tab-btn" data-category="学校">学校</button>
                    <button type="button" class="tab-btn" data-category="その他">その他</button>
                </div>
                <div id="schedule-list" class="schedule-list"></div>
            </div>
            <div id="calendar-view" class="calendar-view" hidden></div>
            <div id="finance-view" class="finance-view" hidden style="padding:1rem;">
                <h3 style="margin-top:0; font-size:1rem;">今月の収支</h3>
                <form id="finance-form" style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem; flex-wrap:wrap;">
                    <select id="finance-type" style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px;">
                        <option value="slot">スロット</option>
                        <option value="pachinko">パチンコ</option>
                        <option value="other">その他</option>
                    </select>
                    <input type="date" id="finance-date" required style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px;">
                    <input type="number" id="finance-investment" placeholder="投資 (円)" required style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px; width:120px;">
                    <input type="number" id="finance-payout" placeholder="回収 (円)" required style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px; width:120px;">
                    <input type="text" id="finance-note" placeholder="メモ" style="padding:0.4rem; border:1px solid var(--border-color); border-radius:6px; flex:1; min-width:160px;">
                    <button type="submit" class="btn btn-primary" style="padding:0.35rem 0.6rem;">追加</button>
                </form>
                <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;">
                    <label for="finance-mode" style="color:var(--text-secondary); font-size:0.85rem;">表示:</label>
                    <select id="finance-mode" style="padding:0.3rem; border:1px solid var(--border-color); border-radius:6px;">
                        <option value="cumulative">累積</option>
                        <option value="daily">日別</option>
                        <option value="stacked">積み上げ折れ線</option>
                        <option value="bars">棒グラフ</option>
                    </select>
                </div>
                <div style="position:relative;">
                    <canvas id="finance-chart" width="800" height="300" style="max-width:100%; height:300px;"></canvas>
                    <div id="finance-tooltip" class="finance-tooltip" hidden></div>
                </div>
                <div id="finance-legend" style="margin-top:0.5rem; color:var(--text-secondary); font-size:0.9rem;"></div>
                <div id="finance-entries" class="finance-entries" style="margin-top:0.75rem;"></div>
            </div>
        </main>
        <button id="fab-add" class="fab" aria-label="予定を追加">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </div>
    <dialog id="schedule-modal" class="modal">
        <form id="schedule-form" method="dialog">
            <header class="modal-header">
                <div class="modal-header-content">
                    <div style="display: flex; align-items: center; gap: var(--spacing-sm); flex: 1;">
                        <select id="modal-category-select" class="modal-title-select">
                            <option value="その他">その他</option>
                            <option value="バイト">バイト</option>
                            <option value="学校">学校</option>
                        </select>
                        <h2 id="modal-title" style="margin: 0; font-size: 1.1rem;">予定を追加</h2>
                    </div>
                    <button type="button" class="close-btn" id="modal-close">✕</button>
                </div>
            </header>
            <div class="modal-body">
                <input type="hidden" name="id">
                <div class="form-group">
                    <label for="title">タイトル</label>
                    <input type="text" id="title" name="title" autocomplete="off" style="cursor: pointer;">

                </div>
                <div class="form-group">
                    <label for="date">日付</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="start-time">開始</label>
                        <input type="time" id="start-time" name="start-time">
                    </div>
                    <div class="form-group">
                        <label for="end-time">終了</label>
                        <input type="time" id="end-time" name="end-time">
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">メモ</label>
                    <textarea id="description" name="description" rows="3"></textarea>
                </div>
            </div>
            <footer class="modal-footer">
                <button type="button" class="btn btn-danger" id="btn-delete" hidden>削除</button>
                <div class="spacer"></div>
                <button type="button" class="btn btn-secondary" id="btn-cancel">キャンセル</button>
                <button type="submit" class="btn btn-primary" id="btn-save">保存</button>
            </footer>
        </form>
    </dialog>
    <script type="module" src="js/app.js"></script>
</body>

</html>
